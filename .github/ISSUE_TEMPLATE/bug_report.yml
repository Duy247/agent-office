name: Bug report
description: Report a reproducible problem with the office or a connector.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use demo or sanitized data. Never include tokens, local settings, private source events, or real account screenshots.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal scene or sequence of steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, browser, connector, and commit/version
    validations:
      required: true
